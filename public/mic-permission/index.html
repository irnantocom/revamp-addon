<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow microphone - Revamp</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 420px; margin: 15vh auto; padding: 0 16px; color: #111827; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #4b5563; }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; }
      #result { margin-top: 12px; }
      #result.ok { color: #15803d; }
      #result.error { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>Allow the microphone for Revamp</h1>
    <p>Chrome asks once for this extension. After you allow it, close this tab and use the microphone button again.</p>
    <button id="allow" type="button">Allow microphone</button>
    <p id="result" role="status"></p>
    <script src="mic-permission.js"></script>
  </body>
</html>
